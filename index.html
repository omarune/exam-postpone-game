<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>نأجل الامتحان ولا لأ؟ 🤔</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الخلفية المتحركة -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape shape-1">📚</div>
            <div class="shape shape-2">✏️</div>
            <div class="shape shape-3">🎓</div>
            <div class="shape shape-4">📖</div>
            <div class="shape shape-5">📝</div>
            <div class="shape shape-6">🧠</div>
        </div>
    </div>

    <!-- الحاوية الرئيسية -->
    <div class="container">
        <div class="question-box">
            <h1 class="question">
                <span class="question-icon">🤔</span>
                نأجل الامتحان ولا لأ؟
                <span class="question-icon">🤔</span>
            </h1>
            <p class="subtitle">اختار بعناية يا بطل 😏</p>
        </div>

        <div class="buttons-container">
            <button id="yesBtn" class="btn btn-yes" type="button">
                <span class="btn-text">آه</span>
                <span class="btn-icon">🏃‍♂️💨</span>
            </button>

            <button id="noBtn" class="btn btn-no" type="button">
                <span class="btn-text">لا</span>
                <span class="btn-icon">💪</span>
            </button>
        </div>

        <div class="attempt-counter">
            <span id="attemptCount">0</span> محاولة فاشلة 😅
        </div>
    </div>

    <!-- منطقة الرسائل الساخرة -->
    <div id="messageContainer" class="message-container"></div>

    <!-- الرسالة النهائية -->
    <div id="finalMessage" class="final-message hidden">
        <div class="final-content">
            <div class="celebration">🎉</div>
            <h2 class="final-title">شطووور! 👏😂</h2>
            <p class="final-text">روح ذاكر بقا، ربنا يوفقك ❤️</p>
            <div class="final-emoji">
                <span>📚</span>
                <span>✨</span>
                <span>🎯</span>
                <span>✨</span>
                <span>📚</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
